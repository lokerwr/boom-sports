<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boom Sports</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__scriptLoadFailed && window.__scriptLoadFailed('supabase-js')"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js" onerror="window.__scriptLoadFailed && window.__scriptLoadFailed('hls.js')"></script>

<style>
  :root{
    --bg:            #08080A;
    --bg-elevated:   #131316;
    --card:          #1B1B20;
    --card-hover:    #26262D;
    --red:           #F0142C;
    --red-dim:       #A50F20;
    --red-glow:      rgba(240,20,44,0.55);
    --white:         #F5F5F7;
    --muted:         #9A9AA3;
    --muted-dim:     #5C5C64;
    --line:          rgba(255,255,255,0.08);
    --focus-ring:     0 0 0 4px var(--bg), 0 0 0 8px var(--red), 0 0 28px var(--red-glow);
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--white);
    font-family:'Inter',sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--card-hover); border-radius:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .display{
    font-family:'Bebas Neue', 'Inter', sans-serif;
    letter-spacing:1.5px;
  }

  /* ============ SCREEN SWITCHING ============ */
  .screen{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    display:none;
  }
  .screen.active{ display:block; }

  /* ============ LOGIN SCREEN ============ */
  #screen-login{
    display:none;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(240,20,44,0.16), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(240,20,44,0.10), transparent 50%),
      var(--bg);
    align-items:center;
    justify-content:center;
  }
  #screen-login.active{ display:flex; }

  .login-card{
    width:min(560px, 88vw);
    padding: 56px 56px 44px;
    background:linear-gradient(180deg, var(--bg-elevated), #0D0D0F);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.55);
  }
  .brand-wrap{
    display:flex; flex-direction:column; align-items:center;
    margin-bottom:34px;
  }
  .brand-logo{
    display:flex; align-items:baseline; gap:2px;
    font-size:52px; line-height:1;
  }
  .brand-logo img{ height:64px; display:block; }
  .brand-logo .boom{ color:var(--white); }
  .brand-logo .sports{ color:var(--red); }
  .brand-tag{
    margin-top:10px;
    font-size:13px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
    font-weight:600;
  }

  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:12px; font-weight:700; letter-spacing:1.5px;
    color:var(--muted); text-transform:uppercase;
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    background:#0E0E11;
    border:2px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    color:var(--white);
    font-size:18px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{
    border-color:var(--red);
    box-shadow:var(--focus-ring);
  }

  .btn{
    width:100%;
    border:none; border-radius:10px;
    padding:16px 18px;
    font-size:16px; font-weight:800;
    letter-spacing:1.5px; text-transform:uppercase;
    cursor:pointer;
    outline:none;
    transition:transform .12s, box-shadow .15s, background .15s;
  }
  .btn-primary{
    background:linear-gradient(180deg, var(--red), var(--red-dim));
    color:#fff;
    margin-top:8px;
  }
  .btn-primary:focus, .btn-primary:hover{
    box-shadow:var(--focus-ring);
    transform:translateY(-1px);
  }
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    margin-top:14px;
    font-weight:700; font-size:13px;
    letter-spacing:1px; text-transform:none;
  }
  .btn-ghost:focus, .btn-ghost:hover{
    color:var(--white);
    box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--red);
  }

  .login-msg{
    min-height:20px;
    margin-top:14px;
    font-size:13px; font-weight:600;
    text-align:center;
    color:var(--red);
  }
  .login-msg.ok{ color:#39d982; }

  .login-spinner{
    display:none;
    width:20px; height:20px;
    border:3px solid rgba(255,255,255,0.25);
    border-top-color:#fff;
    border-radius:50%;
    margin:14px auto 0;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ============ HOME / PLAYER SCREEN ============ */
  #screen-home{ background:#000; }
  .player-stage{
    position:absolute; inset:0;
    background:#000;
    display:flex; align-items:center; justify-content:center;
  }
  #player{
    width:100%; height:100%;
    object-fit:cover;
    background:#000;
  }
  .empty-state{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    color:var(--muted);
    text-align:center;
    pointer-events:none;
  }
  .empty-state .display{ font-size:34px; color:var(--white); }
  .empty-state span{ font-size:14px; letter-spacing:1px; }

  .buffer-spinner{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    pointer-events:none;
  }
  .buffer-spinner.show{ display:flex; }
  .buffer-spinner div{
    width:56px; height:56px;
    border:5px solid rgba(255,255,255,0.18);
    border-top-color:var(--red);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }

  /* ---- overlay (fades in/out) ---- */
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:space-between;
    opacity:1;
    transition:opacity .45s ease;
    pointer-events:auto;
  }
  #overlay.hidden{
    opacity:0;
    pointer-events:none;
  }

  .scrim-top{
    position:absolute; top:0; left:0; right:0; height:220px;
    background:linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
    pointer-events:none;
  }
  .scrim-bottom{
    position:absolute; bottom:0; left:0; right:0; height:52%;
    background:linear-gradient(0deg, rgba(0,0,0,0.92) 15%, rgba(0,0,0,0.55) 60%, transparent);
    pointer-events:none;
  }

  .overlay-top{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding: 32px 48px 0;
  }
  .top-left{ display:flex; align-items:center; gap:22px; }
  .home-logo{ display:flex; align-items:baseline; gap:2px; font-size:26px; }
  .home-logo img{ height:34px; display:block; }
  .home-logo .boom{ color:var(--white); }
  .home-logo .sports{ color:var(--red); }

  .now-watching{
    display:flex; align-items:center; gap:10px;
    padding:8px 16px 8px 10px;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--line);
    border-radius:30px;
  }
  .live-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px var(--red-glow);
    animation:pulse 1.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.5; transform:scale(0.8); }
  }
  .now-watching .nw-label{ font-size:10px; font-weight:800; letter-spacing:1.5px; color:var(--muted); }
  .now-watching .nw-name{ font-size:15px; font-weight:700; color:var(--white); }

  .signout-btn{
    background:rgba(255,255,255,0.06);
    border:2px solid var(--line);
    color:var(--muted);
    border-radius:10px;
    padding:12px 22px;
    font-size:13px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    cursor:pointer; outline:none;
    transition:box-shadow .15s, color .15s, border-color .15s;
  }
  .signout-btn:focus, .signout-btn:hover{
    color:var(--white);
    border-color:var(--red);
    box-shadow:var(--focus-ring);
  }

  .overlay-bottom{
    position:relative; z-index:2;
    padding: 0 48px 40px;
  }
  .dock-heading{
    display:flex; align-items:baseline; gap:12px;
    margin-bottom:16px;
  }
  .dock-heading .display{ font-size:24px; color:var(--white); }
  .dock-heading span{ font-size:12px; color:var(--muted); letter-spacing:1px; }

  .dock{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:16px;
    max-height:38vh;
    overflow-y:auto;
    padding:4px 4px 8px;
  }

  .tile{
    position:relative;
    background:var(--card);
    border:2px solid transparent;
    border-radius:14px;
    padding:16px 14px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    cursor:pointer;
    outline:none;
    transition:transform .15s, box-shadow .15s, background .15s, border-color .15s;
  }
  .tile:hover{ background:var(--card-hover); }
  .tile:focus{
    border-color:var(--red);
    box-shadow:var(--focus-ring);
    transform:translateY(-4px) scale(1.04);
    background:var(--card-hover);
    z-index:3;
  }
  .tile.playing{
    border-color:var(--red);
  }
  .tile.playing::after{
    content:'';
    position:absolute; top:8px; right:8px;
    width:8px; height:8px; border-radius:50%;
    background:var(--red);
    box-shadow:0 0 8px var(--red-glow);
  }
  .tile-logo{
    width:56px; height:56px; border-radius:50%;
    background:#0E0E11;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0;
    border:1px solid var(--line);
  }
  .tile-logo img{ width:100%; height:100%; object-fit:contain; }
  .tile-logo .fallback{ font-size:22px; }
  .tile-name{
    font-size:13px; font-weight:700; text-align:center;
    color:var(--white);
    line-height:1.25;
  }
  .tile-views{
    font-size:10px; color:var(--muted-dim); font-weight:600;
    display:flex; align-items:center; gap:4px;
  }

  .loading-screen{
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
    z-index:50;
  }
  .loading-screen .display{ font-size:40px; }
  .loading-screen .boom{ color:var(--white); }
  .loading-screen .sports{ color:var(--red); }
  .loading-bar{
    width:180px; height:4px; border-radius:4px; background:var(--line); overflow:hidden;
  }
  .loading-bar div{
    width:40%; height:100%; background:var(--red);
    animation:loadbar 1.1s ease-in-out infinite;
  }
  @keyframes loadbar{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(250%); }
  }
  .loading-error{
    display:none;
    max-width:520px;
    margin-top:8px;
    padding:18px 22px;
    background:rgba(240,20,44,0.08);
    border:1px solid var(--red-dim);
    border-radius:12px;
    text-align:center;
    color:var(--white);
    font-size:14px;
    line-height:1.6;
  }
  .loading-error.show{ display:block; }
  .loading-error strong{ color:var(--red); display:block; margin-bottom:6px; font-size:15px; }
  .loading-error .retry-btn{
    margin-top:14px;
    background:var(--red);
    color:#fff; border:none; border-radius:8px;
    padding:10px 24px; font-weight:700; font-size:13px;
    letter-spacing:1px; text-transform:uppercase;
    cursor:pointer;
  }

  .toast{
    position:absolute; bottom:28px; left:50%; transform:translateX(-50%);
    background:rgba(20,20,23,0.95);
    border:1px solid var(--line);
    border-left:4px solid var(--red);
    padding:14px 22px;
    border-radius:10px;
    font-size:14px; font-weight:600;
    z-index:10;
    opacity:0; pointer-events:none;
    transition:opacity .25s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div id="loading" class="loading-screen">
  <div class="brand-logo display"><span class="boom">BOOM</span><span class="sports">SPORTS</span></div>
  <div class="loading-bar" id="loading-bar"><div></div></div>
  <div class="loading-error" id="loading-error">
    <strong id="loading-error-title">Couldn't start the app</strong>
    <span id="loading-error-msg"></span>
    <br/>
    <button class="retry-btn" id="loading-retry-btn" tabindex="0">Retry</button>
  </div>
</div>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="screen-login" class="screen">
  <div class="login-card">
    <div class="brand-wrap">
      <div class="brand-logo display"><span class="boom">BOOM</span><span class="sports">SPORTS</span></div>
      <div class="brand-tag">Live Channels &amp; Leagues</div>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" inputmode="email" required tabindex="0" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required tabindex="0" />
      </div>
      <button type="submit" id="submit-btn" class="btn btn-primary" tabindex="0">Sign In</button>
      <button type="button" id="toggle-mode-btn" class="btn btn-ghost" tabindex="0">Need an account? Create one</button>
      <div class="login-spinner" id="login-spinner"></div>
      <div class="login-msg" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- ===================== HOME / DISCOVERY SCREEN ===================== -->
<div id="screen-home" class="screen">
  <div class="player-stage">
    <video id="player" playsinline muted></video>
    <div class="empty-state" id="empty-state">
      <div class="display">SELECT A CHANNEL TO START WATCHING</div>
      <span>USE YOUR REMOTE TO CHOOSE FROM THE LIST BELOW</span>
    </div>
    <div class="buffer-spinner" id="buffer-spinner"><div></div></div>
  </div>

  <div id="overlay">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="overlay-top">
      <div class="top-left">
        <div class="home-logo display"><span class="boom">BOOM</span><span class="sports">SPORTS</span></div>
        <div class="now-watching" id="now-watching" style="display:none;">
          <span class="live-dot"></span>
          <div>
            <div class="nw-label">NOW WATCHING</div>
            <div class="nw-name" id="nw-name">—</div>
          </div>
        </div>
      </div>
      <button class="signout-btn" id="signout-btn" tabindex="0">Sign Out</button>
    </div>

    <div class="overlay-bottom">
      <div class="dock-heading">
        <div class="display">CHANNELS &amp; LEAGUES</div>
        <span id="dock-count"></span>
      </div>
      <div class="dock" id="dock"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================================================================
   BOOM SPORTS — TV Web App
   Screens: Login -> Discovery/Home (fullscreen live player)
   Data source: Supabase table `sports_hub`, row id='main', jsonb `data`
   ===================================================================== */

const SUPABASE_URL = "https://wxprtwuutysqdtgxnppq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4cHJ0d3V1dHlzcWR0Z3hucHBxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjA5MTgsImV4cCI6MjEwMTIzNjkxOH0.Qm2s3jVhcsJEauQJ7wdA5Q3x3vqjBlK2xRfw58P9kQ4";
const SPORTS_TABLE = "sports_hub";
const SPORTS_ROW_ID = "main";
const OVERLAY_HIDE_DELAY = 5000; // ms of inactivity before overlay auto-dismisses
const BOOT_TIMEOUT_MS = 9000; // if boot hasn't finished by this point, show an on-screen error instead of spinning forever

const el = (id) => document.getElementById(id);

/* ============ FAIL-SAFE LOADING (never spin forever) ============
   Smart TV browsers can silently fail to load a CDN script or reach
   an API (blocked domain, bad DNS, wrong system clock, restricted
   network) with no console to see why. Everything below makes sure
   that instead of an endless spinner, the person always ends up
   seeing either the app or a plain-language error, right on the TV. */
let bootFinished = false;

function showLoadingError(title, msg){
  if (bootFinished) return; // don't show a stale error after we've already recovered
  el('loading-bar').style.display = 'none';
  const box = el('loading-error');
  box.classList.add('show');
  el('loading-error-title').textContent = title;
  el('loading-error-msg').textContent = msg;
}

window.__scriptLoadFailed = function(name){
  showLoadingError(
    'Couldn\'t load a required file',
    'The app could not download "' + name + '" from the internet. This is usually a TV network/firewall issue, not the app itself. Check the TV\'s internet connection and date & time settings, then retry.'
  );
};

window.addEventListener('error', function(e){
  showLoadingError('Something went wrong', (e && e.message) ? e.message : 'An unexpected error occurred while starting the app.');
});
window.addEventListener('unhandledrejection', function(e){
  showLoadingError('Something went wrong', (e && e.reason && e.reason.message) ? e.reason.message : 'An unexpected error occurred while starting the app.');
});

el('loading-retry-btn').addEventListener('click', function(){ location.reload(); });

setTimeout(function(){
  if (!bootFinished) {
    showLoadingError(
      'Taking too long to start',
      'The app is still trying to connect after several seconds. Check the TV\'s internet connection and date & time settings (an incorrect clock can block secure connections), then retry.'
    );
  }
}, BOOT_TIMEOUT_MS);

/* ---------- screen management ---------- */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  el('screen-' + name).classList.add('active');
}

/* ---------- boot ---------- */
let currentChannels = [];
let hls = null;
let hideTimer = null;
let overlayVisible = true;
let hasStartedPlayback = false;
let focusGrid = []; // array of rows, each row an array of tile elements
let activeTileEl = null;
let sb = null;

async function boot(){
  try {
    if (typeof supabase === 'undefined') {
      throw new Error('The Supabase library did not load. Check the TV\'s internet connection and retry.');
    }
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { data: { session } } = await sb.auth.getSession();

    bootFinished = true;
    el('loading').style.display = 'none';

    if (session) {
      showScreen('home');
      initHome();
    } else {
      showScreen('login');
      el('email').focus();
    }
  } catch (err) {
    showLoadingError(
      'Couldn\'t connect',
      (err && err.message) ? err.message : 'Could not reach the login service. Check the TV\'s internet connection and retry.'
    );
  }
}

/* ===================== LOGIN ===================== */
let mode = 'signin'; // or 'signup'

el('toggle-mode-btn').addEventListener('click', () => {
  mode = mode === 'signin' ? 'signup' : 'signin';
  el('submit-btn').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
  el('toggle-mode-btn').textContent = mode === 'signin'
    ? 'Need an account? Create one'
    : 'Already have an account? Sign in';
  el('login-msg').textContent = '';
});

el('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = el('email').value.trim();
  const password = el('password').value;
  const msg = el('login-msg');
  const spinner = el('login-spinner');
  msg.textContent = '';
  msg.classList.remove('ok');

  if (!email || !password) {
    msg.textContent = 'Enter both email and password.';
    return;
  }

  spinner.style.display = 'block';
  el('submit-btn').disabled = true;

  try {
    let result;
    if (mode === 'signin') {
      result = await sb.auth.signInWithPassword({ email, password });
    } else {
      result = await sb.auth.signUp({ email, password });
    }
    if (result.error) throw result.error;

    if (mode === 'signup' && !result.data.session) {
      msg.classList.add('ok');
      msg.textContent = 'Account created. Check your email to confirm, then sign in.';
      mode = 'signin';
      el('submit-btn').textContent = 'Sign In';
      el('toggle-mode-btn').textContent = 'Need an account? Create one';
    } else {
      showScreen('home');
      initHome();
    }
  } catch (err) {
    msg.textContent = err.message || 'Something went wrong. Try again.';
  } finally {
    spinner.style.display = 'none';
    el('submit-btn').disabled = false;
  }
});

/* Arrow-key navigation between login fields/buttons */
const loginFocusOrder = ['email','password','submit-btn','toggle-mode-btn'];
document.addEventListener('keydown', (e) => {
  if (!el('screen-login').classList.contains('active')) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const active = document.activeElement;
  const idx = loginFocusOrder.indexOf(active.id);
  if (idx === -1) return;
  e.preventDefault();
  const next = e.key === 'ArrowDown'
    ? Math.min(idx + 1, loginFocusOrder.length - 1)
    : Math.max(idx - 1, 0);
  el(loginFocusOrder[next]).focus();
});

/* ===================== HOME / DISCOVERY ===================== */
el('signout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  stopPlayback();
  el('email').value = '';
  el('password').value = '';
  showScreen('login');
  el('email').focus();
});

async function initHome(){
  showToast('Loading channels…');
  const { data, error } = await sb
    .from(SPORTS_TABLE)
    .select('data')
    .eq('id', SPORTS_ROW_ID)
    .single();

  if (error || !data) {
    showToast('Could not load channels. Check your connection.');
    return;
  }

  currentChannels = parseSportsData(data.data || {});
  renderDock();
  el('signout-btn').focus();
  attachRemoteHandlers();
}

/* Mirrors the Flutter app's _parseSportsData: every top-level string key
   that isn't Featured_Image/Sub_Text and doesn't end in one of the known
   suffixes is a channel/league logo; sibling keys carry its video/clicks. */
const SKIP_KEYS = new Set(['Featured_Image', 'Sub_Text']);
const SKIP_SUFFIXES = ['_Video', '_ClickCount', '_LastReset', '_MatchId', '_DisplayName'];

function parseSportsData(data){
  const channels = [];
  for (const key of Object.keys(data)) {
    const value = data[key];
    if (SKIP_KEYS.has(key)) continue;
    if (SKIP_SUFFIXES.some(suf => key.endsWith(suf))) continue;
    if (typeof value !== 'string' || value.trim() === '') continue;

    const videoUrl = data[key + '_Video'];
    if (!videoUrl || typeof videoUrl !== 'string' || videoUrl.trim() === '') continue; // no stream, skip tile

    let name = data[key + '_DisplayName'];
    if (!name || !String(name).trim()) {
      name = key.replace(/^Legues_/, '').replace(/_/g, ' ').trim();
      name = name.split(' ').filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1).toLowerCase()).join(' ');
    }

    const clickCount = Number(data[key + '_ClickCount']) || 0;

    channels.push({ key, name: name.trim(), logo: value, videoUrl: videoUrl.trim(), clickCount });
  }
  // most-watched first, like the app's "Top" sort
  channels.sort((a, b) => b.clickCount - a.clickCount);
  return channels;
}

function renderDock(){
  const dock = el('dock');
  dock.innerHTML = '';
  el('dock-count').textContent = currentChannels.length + (currentChannels.length === 1 ? ' channel' : ' channels');

  currentChannels.forEach((ch, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.tabIndex = 0;
    tile.dataset.index = i;
    tile.innerHTML = `
      <div class="tile-logo">
        <img src="${escapeAttr(ch.logo)}" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback\\'>📺</span>';" />
      </div>
      <div class="tile-name">${escapeHtml(ch.name)}</div>
      ${ch.clickCount > 0 ? `<div class="tile-views">👁 ${ch.clickCount}</div>` : ''}
    `;
    tile.addEventListener('click', () => selectChannel(i, tile));
    tile.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectChannel(i, tile);
      }
    });
    dock.appendChild(tile);
  });

  buildFocusGrid();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

/* Group tiles into visual rows (by offsetTop) so ArrowUp/Down can jump
   to the nearest column in the adjacent row — works regardless of how
   many columns the responsive grid ends up with. */
function buildFocusGrid(){
  requestAnimationFrame(() => {
    const tiles = Array.from(el('dock').children);
    focusGrid = [];
    let currentRow = [];
    let lastTop = null;
    tiles.forEach(t => {
      const top = t.offsetTop;
      if (lastTop === null || Math.abs(top - lastTop) < 4) {
        currentRow.push(t);
      } else {
        focusGrid.push(currentRow);
        currentRow = [t];
      }
      lastTop = top;
    });
    if (currentRow.length) focusGrid.push(currentRow);
  });
}

function findTilePosition(tileEl){
  for (let r = 0; r < focusGrid.length; r++) {
    const c = focusGrid[r].indexOf(tileEl);
    if (c !== -1) return { r, c };
  }
  return null;
}

/* ---------- playback ---------- */
function selectChannel(index, tileEl){
  const ch = currentChannels[index];
  if (!ch) return;

  document.querySelectorAll('.tile.playing').forEach(t => t.classList.remove('playing'));
  tileEl.classList.add('playing');
  activeTileEl = tileEl;

  el('empty-state').style.display = 'none';
  el('now-watching').style.display = 'flex';
  el('nw-name').textContent = ch.name;

  playStream(ch.videoUrl);
  bestEffortIncrementClick(ch.key);

  hasStartedPlayback = true;
  resetHideTimer();
}

function playStream(url){
  const video = el('player');
  showBuffering(true);

  if (hls) { hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute('src');
  video.load();

  const isHls = url.includes('.m3u8');

  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.muted = false;
      video.play().catch(() => {});
    });
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) {
        showToast('Stream unavailable right now.');
        showBuffering(false);
      }
    });
  } else {
    video.src = url;
    video.muted = false;
    video.play().catch(() => {});
  }

  video.oncanplay = () => showBuffering(false);
  video.onwaiting = () => showBuffering(true);
  video.onplaying = () => showBuffering(false);
}

function stopPlayback(){
  if (hls) { hls.destroy(); hls = null; }
  const video = el('player');
  video.pause();
  video.removeAttribute('src');
  video.load();
  el('empty-state').style.display = 'flex';
  el('now-watching').style.display = 'none';
  document.querySelectorAll('.tile.playing').forEach(t => t.classList.remove('playing'));
  hasStartedPlayback = false;
  showOverlay();
  clearTimeout(hideTimer);
}

function showBuffering(show){
  el('buffer-spinner').classList.toggle('show', show);
}

async function bestEffortIncrementClick(key){
  try {
    const { data } = await sb.from(SPORTS_TABLE).select('data').eq('id', SPORTS_ROW_ID).single();
    if (!data) return;
    const fresh = data.data || {};
    fresh[key + '_ClickCount'] = (Number(fresh[key + '_ClickCount']) || 0) + 1;
    fresh[key + '_LastReset'] = new Date().toISOString();
    await sb.from(SPORTS_TABLE).update({ data: fresh }).eq('id', SPORTS_ROW_ID);
  } catch (e) {
    // Non-critical analytics write — safe to ignore (e.g. RLS blocks anon writes).
  }
}

/* ---------- overlay show/hide ---------- */
function showOverlay(){
  overlayVisible = true;
  el('overlay').classList.remove('hidden');
}
function hideOverlay(){
  if (!hasStartedPlayback) return; // never hide before something is playing
  overlayVisible = false;
  el('overlay').classList.add('hidden');
}
function resetHideTimer(){
  clearTimeout(hideTimer);
  if (!hasStartedPlayback) return;
  hideTimer = setTimeout(hideOverlay, OVERLAY_HIDE_DELAY);
}

/* ---------- remote / keyboard navigation on home screen ---------- */
function attachRemoteHandlers(){
  document.addEventListener('keydown', onHomeKeydown);
  document.addEventListener('click', onHomeClick);
  document.addEventListener('mousemove', onHomeActivity);
}

function onHomeClick(){
  if (!el('screen-home').classList.contains('active')) return;
  if (!overlayVisible) { showOverlay(); resetHideTimer(); return; }
  resetHideTimer();
}
function onHomeActivity(){
  if (!el('screen-home').classList.contains('active')) return;
  if (overlayVisible) resetHideTimer();
}

function onHomeKeydown(e){
  if (!el('screen-home').classList.contains('active')) return;

  const navKeys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape','Backspace'];
  if (!navKeys.includes(e.key)) return;

  // First press while overlay is hidden: just reveal it, don't act further.
  if (!overlayVisible) {
    e.preventDefault();
    showOverlay();
    resetHideTimer();
    if (activeTileEl) activeTileEl.focus();
    return;
  }

  if (e.key === 'Escape' || e.key === 'Backspace') {
    e.preventDefault();
    if (hasStartedPlayback) { clearTimeout(hideTimer); hideOverlay(); }
    return;
  }

  resetHideTimer();

  const active = document.activeElement;
  const isSignout = active && active.id === 'signout-btn';
  const isTile = active && active.classList && active.classList.contains('tile');

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
    e.preventDefault();

    if (isSignout) {
      if (e.key === 'ArrowDown' && focusGrid[0] && focusGrid[0][0]) focusGrid[0][0].focus();
      return;
    }

    if (isTile) {
      const pos = findTilePosition(active);
      if (!pos) return;
      let { r, c } = pos;

      if (e.key === 'ArrowRight') {
        if (focusGrid[r][c + 1]) focusGrid[r][c + 1].focus();
      } else if (e.key === 'ArrowLeft') {
        if (c === 0) { el('signout-btn').focus(); }
        else if (focusGrid[r][c - 1]) focusGrid[r][c - 1].focus();
      } else if (e.key === 'ArrowDown') {
        if (focusGrid[r + 1]) {
          const target = focusGrid[r + 1][c] || focusGrid[r + 1][focusGrid[r + 1].length - 1];
          target.focus();
        }
      } else if (e.key === 'ArrowUp') {
        if (r === 0) { el('signout-btn').focus(); }
        else {
          const target = focusGrid[r - 1][c] || focusGrid[r - 1][focusGrid[r - 1].length - 1];
          target.focus();
        }
      }
      return;
    }

    // nothing sensible focused — default to first tile
    if (focusGrid[0] && focusGrid[0][0]) focusGrid[0][0].focus();
  }
}

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

boot();
</script>
</body>
</html>
